name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["web/**", ".github/workflows/pages.yml"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publish a release with this version (e.g. 1.0.0). Leave empty for a test build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Pick version
        run: |
          R="${{ github.event.inputs.release_version }}"
          FILE_V="$(tr -d '[:space:]' < version.txt)"
          if [[ -n "$R" ]]; then V="${R#v}"; echo "RELEASE=true" >> "$GITHUB_ENV";
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; echo "RELEASE=true" >> "$GITHUB_ENV";
          elif [[ "$GITHUB_REF" == refs/heads/main && "${{ github.event_name }}" == "push" ]]; then
            # Merging to main publishes a release when version.txt names a version that has no release yet.
            if git ls-remote --exit-code --tags origin "refs/tags/v$FILE_V" > /dev/null 2>&1; then
              V="0.0.${{ github.run_number }}"
              echo "v$FILE_V already released: test build only. Raise version.txt to publish a new release."
            else
              V="$FILE_V"; echo "RELEASE=true" >> "$GITHUB_ENV"
            fi
          else V="0.0.${{ github.run_number }}"; fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"

      - name: Unlock the signing key
        env:
          KEYSTORE_PASSPHRASE: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          if [ -z "$KEYSTORE_PASSPHRASE" ]; then echo "::error::Add the KEYSTORE_PASSPHRASE secret in Settings > Secrets and variables > Actions"; exit 1; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/release.jks.enc -out signing/release.jks -pass env:KEYSTORE_PASSPHRASE

      - name: Unit tests and release build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSPHRASE }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: ./gradlew :core:test assembleRelease -PversionName=$VERSION_NAME -PversionCode=${{ github.run_number }} --stacktrace

      - name: Name the APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "pocketta-$VERSION_NAME.apk"
          ls -lh "pocketta-$VERSION_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: pocketta-${{ env.VERSION_NAME }}
          path: pocketta-${{ env.VERSION_NAME }}.apk

      - name: Publish release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Pocketta ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          files: pocketta-${{ env.VERSION_NAME }}.apk
          generate_release_notes: true
